name: LumiPay CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci


    - name: Build Next.js App
      run: npm run build
      env:
        # Provide dummy env vars so the build doesn't fail if they are strictly required
        NEXT_PUBLIC_GOLDSKY_URL: "https://dummy-url"
        GEMINI_API_KEY: "dummy-key"
        NEXT_PUBLIC_PRIVY_APP_ID: "dummy-app-id"
