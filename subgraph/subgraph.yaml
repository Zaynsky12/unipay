specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: LumiPayRegistry
    network: arc-testnet
    source:
      address: "0xb5205464aa829dff44d2e6e1d8d12313367d7fa3"
      abi: LumiPayRegistry
      startBlock: 42320000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Merchant
        - PaymentSession
        - Transaction
        - Protocol
        - SubscriptionPlan
        - SubscriptionPayment
      abis:
        - name: LumiPayRegistry
          file: ./abis/LumiPayRegistry.json
      eventHandlers:
        - event: MerchantRegistered(indexed address,string,string)
          handler: handleMerchantRegistered
        - event: SessionCreated(indexed bytes32,indexed address,uint256,address,string,uint256,bool)
          handler: handleSessionCreated
        - event: SessionDeactivated(indexed bytes32)
          handler: handleSessionDeactivated
        - event: PaymentCompleted(indexed bytes32,indexed address,indexed address,uint256)
          handler: handlePaymentCompleted
        - event: SubscriptionCreated(indexed bytes32,indexed address,indexed address,uint256,uint256,bytes32)
          handler: handleSubscriptionCreated
        - event: SubscriptionExecuted(indexed bytes32,indexed address,indexed address,uint256)
          handler: handleSubscriptionExecuted
        - event: SubscriptionCancelled(indexed bytes32)
          handler: handleSubscriptionCancelled
      file: ./src/mapping.ts
